# 海南文昌发射中心（CLI 默认发射场；runtime 须显式 --launchpad 指向本文件或自备 lp）。
# 文昌航天发射场公开坐标约 19.614°N / 110.951°E，但该点在现地表包海岸线
# 分类中为水面；原点西移至场区内陆侧 110.930°E（包内分类陆地，medium 地形高约 1.4 m）。
# 本轮不带高程覆盖，地面走全球地表包（CLI 默认 medium 档）。
# base_elevation_m：发射场底部（场坪）高程，与地表包同口径（相对 R_elev）；
# 取默认 medium 包在原点工作层级的采样高约 1.4 m（low 包同点约 3.8 m，
# 档位差在台位点超差告警阈值 5 m 内）。局部高程高于此值在采样时截平（水面不处理）。
schema = 2
name = "海南文昌发射中心"
body = "Earth"
latitude_deg = 19.614
longitude_deg = 110.930
base_elevation_m = 1.4

# LC-101：axis_offset_m 缺省（原点处，台架高度 0 = 顶面与场坪齐平，暂定值）。
[[pads]]
name = "LC-101"
