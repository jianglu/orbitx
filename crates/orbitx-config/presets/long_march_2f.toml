# 长征二号F（CZ-2F）— 载人火箭，发射神舟飞船（Y 型构型近似）
# 芯一级 + 四液助推（独立 vessel 侧向 Dock）+ 二级 + 神舟
#
# 参数为公开资料汇总近似值，非遥测级精度。
# 来源（优先级）：
#   1. 国家航天局 · 长征二号F
#      https://www.cnsa.gov.cn/n6758824/n6759008/n6759011/c6794041/content.html
#      （总体 ~480 t、全长 58.34 m、芯径 3.35 m、助推径 2.25 m）
#   1. 中国航天科技集团公开介绍
#      https://m.spacechina.com/n146/n238/n12985/c3961203/content.html
#   2. 中文维基 · 长征二号F运载火箭（条目内引用新华社等）
#      https://zh.wikipedia.org/zh-hans/长征二号F运载火箭
#      （分级干/总重、YF-20 / YF-24B 推力与比冲；Y 型 479.8 t / ~5923 kN）
# 仿真未单独建模逃逸塔/整流罩结构；与官方起飞质量差额并入载荷级干重。
# Orbiter 树内无 CZ-2F 配置，不对照。

name = "长征二号F Long March 2F"
class = "LongMarch2F"

# 对接边：芯级顶↔二级底；二级顶↔神舟底；芯级四侧口↔四助推
