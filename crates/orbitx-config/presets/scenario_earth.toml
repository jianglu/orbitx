# 默认环境：地心力学 + 只显示的太阳。别名 `earth`。
# mjd 定版（P4.5，2026-10-24 二次裁定）：按「发射场（文昌 110.9°E）本地正午、
# 太阳近天顶」会话实测定点。旧口径（luma 扫描 51545.0=186/255 峰值）是在
# 预览坐标系量的（地球摆放/定向与会话不同），作废；会话实测（selftest frame
# diag：tosun_dot_up=+0.94、up_geo=19.6N/110.9E）51545.40 = 文昌正午。
# 另注：planet_rot 消费侧有 −90° 经度基准补偿（solar_controller 钉注），改动
# 定向链路时须同步。改动时同步 GODOT 侧夜间/白天验收口径。
name = "EarthSun"
star = "Sun"
