syntax = "proto3";
package orbitx.v1;

// Client → Runtime 入站（对应 RuntimeInbound）。
message Inbound {
  oneof payload {
    InputCmd input = 1;
    SessionCmd session = 2;
  }
}

message InputCmd {
  oneof kind {
    SetThrottle set_throttle = 1;
    SetAttitudeAxes set_attitude_axes = 2;
    Separate separate = 3;
    SetGravityTurn set_gravity_turn = 4;
    WorkflowIgnite workflow_ignite = 5;
    SetRcsEnabled set_rcs_enabled = 6;
    SetAttitudeNose set_attitude_nose = 7;
  }
}

message SetThrottle {
  double level = 1;
}

message SetAttitudeAxes {
  double pitch = 1;
  double yaw = 2;
  double roll = 3;
}

message Separate {}

message SetGravityTurn {
  bool enabled = 1;
}

message WorkflowIgnite {}

message SetRcsEnabled {
  bool enabled = 1;
}

// 罗盘机头指向（场景手动控制新指令）：方位角 [rad] 0=北顺时针（随星球
// 自转每 tick 重投影当地罗盘架）、仰角 [rad]（±90° 极点塌缩就近极竖直）。
// roll 仅为目标记录（TVC 无滚转执行机构）。
message SetAttitudeNose {
  double azimuth = 1;
  double elevation = 2;
  double roll = 3;
}

message SessionCmd {
  oneof kind {
    Pause pause = 1;
    Resume resume = 2;
    SetWarp set_warp = 3;
    Step step = 4;
    Shutdown shutdown = 5;
    Reset reset = 6;
    SetSurfaceWorkingMaxLevel set_surface_working_max_level = 7;
    Launch launch = 8;
    // 延迟会话配置（空载启动后客户端下发；仅空载期有效，运行期忽略）。
    Configure configure = 9;
    // 按参数请求停机收尾（C3b）：复用停机收尾分派（固定三开），reason 随
    // Halted.reason 回传；幂等——会话已终态（Halted 已发）忽略。
    HaltRequest halt_request = 10;
  }
}

// 延迟会话配置（领域中立：客户端进程读得到的配置才可下发；不感知任何
// 上层包概念）。空载启动（argv 无会话级参数）时，runtime 收到本消息才
// 构建会话；校验结果经 ack 通道回执（见 outbound.proto ConfigureAck）。
message Configure {
  // 火箭类：内置别名或 sim.toml 路径（航天器三文件落盘 user://，无内嵌态）。
  string rocket = 1;
  // 环境：别名 `earth` 或 scenario toml 路径；`scenario_toml` 内嵌优先。
  string scenario_alias_or_path = 2;
  // 内嵌环境 TOML 文本（非空时忽略 alias_or_path；客户端进程读虚拟
  // 文件系统后直传，runtime 独立进程读不到的来源走此通道）。
  string scenario_toml = 3;
  // 发射场：lp toml 路径；`launchpad_toml` 内嵌优先。
  string launchpad_path = 4;
  string launchpad_toml = 5;
  // 可选台位名（空 = lp 第一个台位）。
  string pad = 6;
  // 覆盖台位朝向 [deg] / 起始历元 [MJD]（has_* = false 表示未指定）。
  double heading_deg = 7;
  bool has_heading_deg = 8;
  double mjd = 9;
  bool has_mjd = 10;
  // 共用地表包根目录（含 manifest.toml；空 = 无地表包，光滑球）。
  string surface_package = 11;
  // 地表工作集最大层级（has_* = false 表示用包上限）。
  uint32 surface_working_max_level = 12;
  bool has_surface_working_max_level = 13;
  // 控制模式：`base` | `target`（与 workflow_path 互斥，二选一必填）。
  string control = 14;
  // 工作流 TOML 路径（与 control 互斥；kind 由文件内容决定）。
  string workflow_path = 15;
  // 通用会话上下文标签（key-value；协议侧零业务概念，runtime 只认
  // 键名做机械处理）。当前唯一消费键 `recorder_subtree`：黑匣子会话目录
  // 的相对子树（见 RUNTIME.md / FLIGHT_RECORDER.md「竞赛会话子树」）。
  map<string, string> session_context = 16;
  // 黑匣子 schema 版本协商（has_* = false 表示客户端不声明）。与
  // runtime 实际版本不符 → ConfigureAck err 拒飞；实际版本经
  // ConfigureAck.recorder_schema_version 回带。
  uint32 recorder_schema_expected = 17;
  bool has_recorder_schema_expected = 18;
}

// 发射门禁解禁（预发射 hold：首帧输出后不步进，收到 Launch 才开始步进）。
message Launch {}

message SetSurfaceWorkingMaxLevel {
  uint32 level = 1;
}

message Pause {}
message Resume {}
message Shutdown {}
message Reset {}

message SetWarp {
  double scale = 1;
}

message Step {
  uint32 n = 1;
}

// 停机原因（C3b）：通用枚举，引擎零竞赛语义（业务含义由消费方赋予——
// 见 sim-rocket COMPETITION.md §10 结算链四分支）。图内 halt 路径固定
// 回传 WORKFLOW_HALT；HaltRequest 路径回传请求值；UNSPECIFIED = 旧
// runtime / 未填（客户端按 UNSPECIFIED 兜底解释）。
enum HaltReason {
  HALT_REASON_UNSPECIFIED = 0;
  HALT_REASON_COMPLETION = 1;
  HALT_REASON_SIM_TIME_EXCEEDED = 2;
  HALT_REASON_WALL_TIME_EXCEEDED = 3;
  HALT_REASON_WORKFLOW_HALT = 4;
}

// 停机收尾请求（C3b）：DLC 完成判定器判成 / 超时监测触发——按固定三开
// （shutdown_controls + stop_stepping + save_recorder 全 true）执行停机
// 收尾（flush + Halted），幂等。
message HaltRequest {
  HaltReason reason = 1;
}
